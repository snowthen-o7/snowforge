<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Fraunces:ital,opsz,wght@1,144,700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1500px;
    height: 500px;
    overflow: hidden;
    background: #f8fafc;
    font-family: 'Inter', system-ui, sans-serif;
    color: #0f172a;
  }
  .banner {
    width: 1500px;
    height: 500px;
    position: relative;
    background: #f8fafc;
    background-image:
      radial-gradient(circle at 88% 30%, rgba(249, 115, 22, 0.10), transparent 50%),
      radial-gradient(circle at 12% 85%, rgba(37, 99, 235, 0.06), transparent 55%);
  }
  .content {
    position: absolute;
    top: 50%;
    left: 420px;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 48px;
  }
  .logo img {
    display: block;
    height: 230px;
    width: auto;
  }
  .text-block {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .wordmark {
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 800;
    font-size: 94px;
    line-height: 1;
    letter-spacing: -0.035em;
    color: #0f172a;
  }
  .tagline {
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 500;
    font-size: 34px;
    line-height: 1.2;
    letter-spacing: -0.015em;
    color: #475569;
  }
  .tagline em {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    background-image: linear-gradient(135deg, #f97316, #ea580c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  /* Subtle flow lines top-right as decoration */
  .flow-lines {
    position: absolute;
    top: 40px;
    right: 30px;
    width: 380px;
    height: 400px;
    opacity: 0.45;
  }
</style>
</head>
<body>
<div class="banner">
  <svg class="flow-lines" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f97316" stop-opacity="0"/>
        <stop offset="50%" stop-color="#f97316" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#ea580c" stop-opacity="0.8"/>
      </linearGradient>
    </defs>
    <path d="M 10 90 Q 200 50, 400 110" stroke="url(#lineGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 10 160 Q 220 130, 400 180" stroke="url(#lineGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 10 230 Q 200 200, 400 250" stroke="url(#lineGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 10 300 Q 230 270, 400 320" stroke="url(#lineGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>

  <div class="content">
    <div class="logo">
      <img src="favicon/icon-1024.png" alt="SnowForge logo"/>
    </div>
    <div class="text-block">
      <div class="wordmark">SnowForge</div>
      <div class="tagline">Small tools, made with <em>big care.</em></div>
    </div>
  </div>
</div>
</body>
</html>
